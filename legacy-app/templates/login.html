{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>{{ form.username.label }} {{ form.username(size=32) }}</label>
    {% for error in form.username.errors %}<div class="error">{{ error }}</div>{% endfor %}

    <label>{{ form.password.label }} {{ form.password(size=32, type="password") }}</label>
    {% for error in form.password.errors %}<div class="error">{{ error }}</div>{% endfor %}

    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
